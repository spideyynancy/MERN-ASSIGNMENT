<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Perfectly centred login form using Flexbox.">
  <title>Centred Login Form</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, sans-serif; background-color: #f1f5f9; }

    /* Centering Layout using Flexbox */
    body { display: flex; align-items: center; justify-content: center; padding: 20px; }

    .login-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .login-card h2 { font-size: 1.5rem; text-align: center; margin-bottom: 20px; color: #1e293b; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.9rem; margin-bottom: 5px; color: #475569; font-weight: 500; }
    .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; outline: none; }
    .form-group input:focus { border-color: #2563eb; }

    .btn-submit {
      width: 100%; padding: 12px; background-color: #2563eb; color: #ffffff;
      border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px;
    }
    .btn-submit:hover { background-color: #1d4ed8; }

    .footer-text { margin-top: 20px; text-align: center; font-size: 0.85rem; color: #64748b; }
    .footer-text a { color: #2563eb; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Login to Your Account</h2>
    <form>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn-submit">Sign In</button>
    </form>

    <div class="footer-text">
      Don't have an account? <a href="#">Sign up</a>
    </div>
  </div>

</body>
</html>
