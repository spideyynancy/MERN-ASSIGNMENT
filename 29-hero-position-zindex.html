<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Landing-page hero section built with position and z-index.">
  <title>Hero Section - position &amp; z-index</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background-color: #f4f4f9; color: #333; line-height: 1.6; }
    
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      overflow: hidden;
      padding: 20px;
    }

    .hero-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('https://via.placeholder.com/1920x1080') center/cover no-repeat;
      opacity: 0.3;
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 800px;
    }

    .hero h1 { font-size: 3rem; margin-bottom: 20px; }
    .hero p { font-size: 1.25rem; margin-bottom: 30px; }

    .btn {
      display: inline-block;
      padding: 12px 30px;
      background-color: #ff6b6b;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .btn:hover { background-color: #ee5253; }
    
    .overlay-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 3;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="hero-bg"></div>
    <div class="overlay-badge">New Feature</div>
    <div class="hero-content">
      <h1>Welcome to Our Platform</h1>
      <p>Discover amazing features built with clean layout using CSS position and z-index.</p>
      <a href="#" class="btn">Get Started</a>
    </div>
  </section>

</body>
</html>
