<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive menu bar using display:flex.">
  <title>Flexbox Menu Bar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background-color: #f4f4f9; color: #333; }

    /* Navigation Bar Container */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1e293b;
      padding: 15px 30px;
      color: #fff;
    }

    .logo { font-size: 1.5rem; font-weight: bold; color: #38bdf8; text-decoration: none; }

    /* Menu Links */
    .nav-links { display: flex; list-style: none; gap: 20px; align-items: center; }
    .nav-links a { color: #f8fafc; text-decoration: none; font-weight: 500; transition: color 0.3s; }
    .nav-links a:hover { color: #38bdf8; }

    /* Action Buttons */
    .nav-actions { display: flex; gap: 10px; }
    .btn { padding: 8px 16px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 0.9rem; }
    .btn-login { color: #fff; border: 1px solid #38bdf8; }
    .btn-signup { background-color: #38bdf8; color: #0f172a; }
    .btn-signup:hover { background-color: #7dd3fc; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="#" class="logo">MyBrand</a>
    
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>

    <div class="nav-actions">
      <a href="#" class="btn btn-login">Log In</a>
      <a href="#" class="btn btn-signup">Sign Up</a>
    </div>
  </nav>

</body>
</html>
